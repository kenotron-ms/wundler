[workspace]
resolver = "2"
members = [
    "crates/wundler-core",
    "crates/wundler-cli",
    "crates/wundler-graph",
    "crates/wundler-transform",
    "crates/wundler-pipeline",
    "crates/wundler-abs",
    "crates/wundler-pgo",
    "crates/wundler-bench",
    "crates/wundler-dev",
    "crates/wundler-html",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
