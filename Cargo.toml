[workspace]
members = [
    "crates/wundler-core",
    "crates/wundler-cli",
    "crates/wundler-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
