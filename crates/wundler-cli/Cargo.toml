[package]
name = "wundler-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wundler"
path = "src/main.rs"

[dependencies]
wundler-core = { path = "../wundler-core" }
wundler-graph = { path = "../wundler-graph" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
