[package]
name = "wundler-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
wundler-core = { path = "../wundler-core" }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
