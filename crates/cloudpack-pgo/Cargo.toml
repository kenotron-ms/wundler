[package]
name = "cloudpack-pgo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
cloudpack-core  = { path = "../cloudpack-core" }
cloudpack-graph = { path = "../cloudpack-graph" }
rusqlite      = { version = "0.31", features = ["bundled"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
thiserror     = "2"
tempfile      = "3"

[dev-dependencies]
tempfile = "3"
