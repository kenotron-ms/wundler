[package]
name = "cloudpack-core"
version = "0.1.0"
edition = "2021"

[dependencies]
swc_core = { version = "65", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
anyhow = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
