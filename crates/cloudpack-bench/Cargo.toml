[package]
name = "cloudpack-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cloudpack-bench"
path = "src/main.rs"

[lib]
name = "cloudpack_bench"
path = "src/lib.rs"

[dependencies]
cloudpack-core    = { path = "../cloudpack-core" }
cloudpack-graph   = { path = "../cloudpack-graph" }
cloudpack-pipeline = { path = "../cloudpack-pipeline" }
anyhow          = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tempfile        = "3"
clap            = { version = "4", features = ["derive"] }
rand            = "0.8"
swc_core        = { version = "65", features = ["ecma_parser", "ecma_ast", "common"] }
