[build]
# Directory cloudpack will scan for TS/TSX source modules
root = "test-app/src"
# Output directory for chunks, manifest.json, and index.html
out_dir = "test-app/dist-cloudpack"
# Use SWC (default): strips dead exports, concatenates, handles TS/TSX
engine = "swc"
source_maps = false
# Promote a module to commons when it appears in ≥2 chunks
commons_threshold = 2

[entry]
# Route "/" maps to the app entry point.
# Suffix-match: "src/main.tsx" matches node path "test-app/src/main.tsx".
"/" = "src/main.tsx"
